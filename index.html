
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoGuia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>:tooth: OdontoGuia</h1>
        <p>Cuide do seu sorriso após o procedimento.</p>
    </header>

    <main>
        <section class="intro">
            <h2>Qual procedimento você realizou?</h2>
            <p>Selecione abaixo para consultar os cuidados.</p>
        </section>

        <section class="procedimentos">

            <button class="procedimento">
                :tooth: Extração de Siso
            </button>

            <button class="procedimento">
                :stethoscope: Tratamento de Canal
            </button>

            <button class="procedimento">
                :sparkles: Clareamento
            </button>

        </section>

        <section id="resultado" class="resultado">
            <h2>Seus cuidados aparecerão aqui</h2>
            <p>Escolha um procedimento para começar.</p>
        </section>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
